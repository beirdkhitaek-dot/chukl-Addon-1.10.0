name: Release

# Run manually: Actions -> Release -> Run workflow, and type the update name.
# The release title becomes "v<mod-version> - <update name>" and the jar is attached as chukl-addon-<mod-version>.jar.
on:
  workflow_dispatch:
    inputs:
      update_name:
        description: "Update name (e.g. Dug Out Highlighter module)"
        required: true
        type: string
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_NAME: ${{ inputs.update_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION=$(grep '^mod-version' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          JAR="build/libs/chukl-addon-${VERSION}.jar"
          test -f "$JAR"
          gh release create "v${VERSION}" "$JAR" \
            --title "v${VERSION} - ${UPDATE_NAME}" \
            --notes "${NOTES:-v${VERSION} - ${UPDATE_NAME}}"
